<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Walterlan Alves dos Santos</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Esta página não existe no portfólio de Walterlan Alves dos Santos.">
  <meta name="robots" content="noindex">
  <script>
    /* O GitHub Pages serve este arquivo em qualquer caminho inexistente, então
       os endereços relativos não servem. Descobre a raiz do site (domínio próprio
       ou /<repositório>/) e carrega os estilos e o link do início a partir dela. */
    (function () {
      try { var t = localStorage.getItem("tema"); if (t === "escuro" || t === "claro") document.documentElement.setAttribute("data-tema", t); } catch (e) {}
      var raiz = "./";
      if (location.protocol !== "file:") {
        var seg = location.pathname.split("/").filter(Boolean)[0];
        raiz = (/\.github\.io$/i.test(location.hostname) && seg && !/\.html$/i.test(seg)) ? "/" + seg + "/" : "/";
      }
      window.RAIZ_SITE = raiz;
      function carregar(base, fallback) {
        ["base.css", "site.css"].forEach(function (f, i) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = base + "assets/css/" + f;
          if (fallback && i === 0) l.onerror = function () {
            /* Não era site de repositório: usa a raiz do domínio. */
            document.querySelectorAll("link[data-tentativa]").forEach(function (x) { x.remove(); });
            window.RAIZ_SITE = fallback;
            carregar(fallback, null);
            ajustarLinks();
          };
          if (fallback) l.setAttribute("data-tentativa", "");
          document.head.appendChild(l);
        });
      }
      carregar(raiz, raiz !== "/" && raiz !== "./" ? "/" : null);
    })();
    function ajustarLinks() {
      document.querySelectorAll("[data-raiz]").forEach(function (a) {
        a.setAttribute("href", (window.RAIZ_SITE || "./") + (a.getAttribute("data-raiz") || ""));
      });
    }
  </script>
</head>
<body data-pagina="erro">
  <main id="conteudo" class="contido erro">
    <p class="erro__codigo" aria-hidden="true">404<span></span></p>
    <h1>Página não encontrada</h1>
    <p>O endereço não existe ou mudou de lugar. Os projetos e o currículo continuam na página inicial.</p>
    <div class="acoes">
      <a class="btn btn--sinal" href="./" data-raiz>Ir para o início</a>
      <a class="btn" href="./#projetos" data-raiz="#projetos">Ver projetos</a>
    </div>
  </main>
  <script>ajustarLinks();</script>
</body>
</html>
